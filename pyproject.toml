[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gammaconv-net"
version = "0.1.0"
description = "Gamma response kernels for small-sample rainfall-runoff modeling"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Yibo Yang"}]
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3", "pandas>=2.2,<3", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "nbclient>=0.10,<1"]

[project.urls]
Repository = "https://github.com/shawny1b0609/gammaConv-net"
Paper = "https://doi.org/10.14042/j.cnki.32.1309.2026.04.002"

[project.scripts]
gammaconv-train = "gammaconv.train:main"
gammaconv-predict = "gammaconv.predict:main"
gammaconv-experiment = "gammaconv.experiment:main"

[tool.setuptools.packages.find]
include = ["gammaconv*", "physics_informed*"]

[tool.ruff]
line-length = 88
