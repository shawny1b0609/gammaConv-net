name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Test data, models, and checkpoint inference
        run: python -m unittest discover -s tests -v
      - name: Run the three-model command-line experiment
        run: python -m gammaconv.experiment --fractions 0.05 --epochs 1 --out runs/ci
      - name: Check plotting and inference
        run: |
          python -m gammaconv.plot --run runs/ci/0.05/dual --out runs/ci/figures
          python -m gammaconv.predict --checkpoint runs/ci/0.05/dual/model.pt --data data/series_a.csv --out runs/ci/predictions.csv
      - name: Run the notebook
        if: matrix.python == '3.12'
        run: |
          python -m pip install nbclient nbformat ipykernel
          python examples/run_notebook.py
      - name: Keep validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: validation-python-${{ matrix.python }}
          path: runs/ci
